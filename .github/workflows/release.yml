name: Release

# Every push to main releases the version of the top CHANGELOG entry,
# unless that version is already released. The tag is created by the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version from CHANGELOG
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          [ -n "$v" ] || { echo "No ## [X.Y.Z] entry in CHANGELOG.md"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.v.outputs.skip != '1'
        run: go test ./pelican ./update ./gear

      - name: Resources (icon, manifest, version info)
        if: steps.v.outputs.skip != '1'
        run: go run ./tools/genres "${{ steps.v.outputs.version }}"

      - name: Build Windows exe
        if: steps.v.outputs.skip != '1'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.appVersion=${{ steps.v.outputs.version }}" -o dist/PelicanConsole.exe .

      - name: Sign update manifest
        if: steps.v.outputs.skip != '1'
        env:
          ZC_SIGNING_KEY: ${{ secrets.ZC_SIGNING_KEY }}
        run: go run ./tools/sign sign "${{ steps.v.outputs.version }}" dist/PelicanConsole.exe

      - name: Release notes from CHANGELOG
        if: steps.v.outputs.skip != '1'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            /^## \[/ { f = 0 }
            f' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publish release
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/PelicanConsole.exe dist/update.json \
            --target "$GITHUB_SHA" --title "v${{ steps.v.outputs.version }}" --notes-file notes.md
