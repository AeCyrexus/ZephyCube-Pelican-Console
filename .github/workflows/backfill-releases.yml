name: Backfill releases (one-off)

# Publishes GitHub Releases for v1.0.0–v1.3.0, which predate release.yml.
# Each exe is rebuilt from its tag with the original toolchain/flags and must
# match the sha256 of the binary that was actually shipped and tested.
# Tags are created by `gh release create --target`.
# Remove this file once the releases exist.

on:
  push:
    branches: ["claude/admiring-thompson-di4p4g"]
    paths: [".github/workflows/backfill-releases.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { v: 1.0.0, commit: 288a4ae0f347caa504a5cf413caa7b2f92941422, sha: 15db1e6ef55fa94c7146e9b2045caa26dcfa6019ffea59862ccef6336dc64640 }
          - { v: 1.1.0, commit: ef04731d25ad64bcae951185bdaa003975778754, sha: 01cbb7da0cf5fcb36d6d87f9c89c57c2213df6c92e80bc10e5c6a5b2901e7e2a }
          - { v: 1.2.0, commit: efbc5fd1128eb51514102dcdcaecb2235979862f, sha: 9434149e1f232b95e50f2e3f185bd54e9375cf9ca0900e18e0fd96ed5ba9a7d2 }
          - { v: 1.3.0, commit: 2a3912048ff86bf5d9d7129ec0296dcaf9f43cd1, sha: a7188c8075929159bee32437c3b5975ebe2d186c5b3a969e7ff5c1b96a446913 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.7
          cache: false

      - name: Skip if release exists
        id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ matrix.v }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (original flags)
        if: steps.chk.outputs.skip != '1'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          if [ -d tools/genres ]; then GOOS= GOARCH= go run ./tools/genres "${{ matrix.v }}"; fi
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags "-H windowsgui -s -w" -o dist/PelicanConsole.exe .

      - name: Verify matches shipped binary
        if: steps.chk.outputs.skip != '1'
        run: echo "${{ matrix.sha }}  dist/PelicanConsole.exe" | sha256sum -c -

      - name: Release notes from CHANGELOG
        if: steps.chk.outputs.skip != '1'
        run: |
          awk -v v="${{ matrix.v }}" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            /^## \[/ { f = 0 }
            f' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publish release
        if: steps.chk.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ matrix.v }}" dist/PelicanConsole.exe \
            --repo "$GITHUB_REPOSITORY" --target "${{ matrix.commit }}" \
            --title "v${{ matrix.v }}" --notes-file notes.md
